server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router): any path that isn't a real
    # static file falls back to index.html so deep links like
    # /accounts/<uuid> and a hard refresh on them both work, instead of
    # nginx 404ing on a path that only React's router knows about.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
