# LedgerCore -- full stack via Docker Desktop.
#
# docker compose up --build
#
# Brings up, in dependency order: Postgres (auto-applying every file in
# db/migrations/ on first boot, since Postgres's own entrypoint image
# runs any *.sql file placed under /docker-entrypoint-initdb.d in
# alphabetical order -- which is exactly why every migration is
# numbered 001, 002, 003... ), Redis, the API, the background worker,
# and the React dashboard (built and served by nginx).
#
# First boot only initializes the database; to start over with a clean
# database, run `docker compose down -v` (the -v drops the postgres
# data volume) before `up` again.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ledgercore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432" # optional -- lets you psql in from the host to poke around
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledgercore"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://ledgercore_app:change_me_in_prod@postgres:5432/ledgercore
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_only_secret_change_in_production_abc123xyz}
      JWT_EXPIRES_IN: 24h
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: ./worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ledgercore_app:change_me_in_prod@postgres:5432/ledgercore
      OUTBOX_BATCH_SIZE: 100
      NOTIFICATION_WEBHOOK_URL: ""

  frontend:
    build:
      context: ./frontend
      args:
        # The browser on the HOST machine calls this URL directly, so it
        # must be the api container's PUBLISHED port (localhost:4000),
        # never the internal compose service name "api".
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
